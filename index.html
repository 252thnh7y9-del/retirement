<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retirement Planner</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1d2330;
      --muted: #5d6677;
      --border: #dde1e8;
      --accent: #2f6fdf;
      --negative: #c62828;
      --retired-row: #eef4ff;
      --networth: #1a8f4c;
      --withdrawal: #d03b3b;
      --grid: #e6e9ee;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171c;
        --card: #1d2128;
        --text: #e6e9ef;
        --muted: #9aa3b2;
        --border: #313744;
        --accent: #6a9cf5;
        --negative: #ff6b6b;
        --retired-row: #1f2a3d;
        --networth: #34b56f;
        --withdrawal: #f26060;
        --grid: #2a2f38;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.4;
    }
    main { max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    .subtitle { margin: 0 0 20px; color: var(--muted); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }
    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 0.9rem; font-weight: 600; }
    input {
      font: inherit;
      font-weight: 400;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .error { color: var(--negative); margin: 12px 0 0; min-height: 1.2em; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { padding: 8px 12px; border-bottom: 1px solid var(--border); text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    th { position: sticky; top: 0; background: var(--card); font-size: 0.85rem; color: var(--muted); }
    tr.retired td { background: var(--retired-row); }
    .chart-wrap { position: relative; }
    #chart { display: block; width: 100%; height: auto; }
    #chart text { fill: var(--muted); font-size: 12px; font-family: inherit; }
    #chart .grid { stroke: var(--grid); stroke-width: 1; }
    #chart .axis { stroke: var(--border); stroke-width: 1; }
    #chart .retire-line { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 4; }
    #chart .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    #chart .networth { stroke: var(--networth); }
    #chart .withdrawal { stroke: var(--withdrawal); stroke-dasharray: 6 4; }
    #chart .dot { stroke: var(--card); stroke-width: 2; }
    #chart .crosshair { stroke: var(--muted); stroke-width: 1; }
    #chart text.label { fill: var(--text); font-weight: 600; }
    .legend { display: flex; gap: 20px; margin: 0 0 8px; font-size: 0.9rem; color: var(--text); flex-wrap: wrap; }
    .legend span { display: inline-flex; align-items: center; gap: 8px; }
    .legend svg { width: 28px; height: 4px; overflow: visible; }
    .tooltip {
      position: absolute; pointer-events: none; display: none;
      background: var(--card); border: 1px solid var(--border); border-radius: 6px;
      padding: 6px 10px; font-size: 0.85rem; white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12); font-variant-numeric: tabular-nums;
    }
    .tooltip .sw { display: inline-block; width: 10px; height: 2px; margin-right: 6px; vertical-align: middle; }
    .table-wrap { max-height: 70vh; overflow: auto; }
    .summary { margin: 0 0 12px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Retirement Planner</h1>
    <p class="subtitle">Project your withdrawals and net worth year by year. Nothing is saved — refreshing resets everything.</p>

    <section class="card">
      <form id="inputs" autocomplete="off" onsubmit="return false">
        <label>Current age
          <input type="number" id="age" min="0" max="120" step="1" placeholder="e.g. 40">
        </label>
        <label>Desired retirement age
          <input type="number" id="retireAge" min="0" max="120" step="1" placeholder="e.g. 65">
        </label>
        <label>Desired retirement income (today's $ / yr)
          <input type="number" id="income" min="0" step="1000" placeholder="e.g. 80000">
        </label>
        <label>Annual inflation (%)
          <input type="number" id="inflation" step="0.1" placeholder="e.g. 3">
        </label>
        <label>Current net worth ($)
          <input type="number" id="netWorth" step="1000" placeholder="e.g. 500000">
        </label>
        <label>Future net worth growth (% / yr)
          <input type="number" id="growth" step="0.1" placeholder="e.g. 6">
        </label>
      </form>
      <p class="error" id="error"></p>
    </section>

    <section class="card">
      <p class="summary" id="summary">Fill in all fields to see your projection.</p>
      <div id="chartArea" hidden>
        <div class="legend">
          <span><svg viewBox="0 0 28 4"><line x1="0" y1="2" x2="28" y2="2" stroke="var(--networth)" stroke-width="2"/></svg>Net worth</span>
          <span><svg viewBox="0 0 28 4"><line x1="0" y1="2" x2="28" y2="2" stroke="var(--withdrawal)" stroke-width="2" stroke-dasharray="6 4"/></svg>Withdrawal</span>
        </div>
        <div class="chart-wrap">
          <svg id="chart" role="img" aria-label="Net worth and withdrawal by age"></svg>
          <div class="tooltip" id="tooltip"></div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Age</th><th>Withdrawal</th><th>Net Worth</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const END_AGE = 100;
    const ids = ["age", "retireAge", "income", "inflation", "netWorth", "growth"];
    const form = document.getElementById("inputs");
    const rowsEl = document.getElementById("rows");
    const summaryEl = document.getElementById("summary");
    const errorEl = document.getElementById("error");
    const money = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });

    // Some browsers restore form values on reload / back navigation; force a clean slate.
    window.addEventListener("pageshow", () => { form.reset(); render(); });

    function readInputs() {
      const v = {};
      for (const id of ids) {
        const raw = document.getElementById(id).value.trim();
        if (raw === "") return null;
        v[id] = Number(raw);
      }
      return v;
    }

    // Each row is one year. Before retirement there is no withdrawal.
    // From retirement on, withdrawal = desired income inflated from today to that age.
    // Net worth = previous year's net worth grown by the growth rate, minus that year's withdrawal.
    // Net worth never goes below zero: the withdrawal is capped at whatever is left,
    // so the year the money runs out takes the remainder and later years withdraw nothing.
    function project({ age, retireAge, income, inflation, netWorth, growth }) {
      const rows = [];
      const inf = inflation / 100;
      const g = growth / 100;
      let nw = Math.max(0, netWorth);
      for (let a = age, i = 0; a <= END_AGE; a++, i++) {
        const available = i === 0 ? nw : nw * (1 + g);
        const desired = a >= retireAge ? income * Math.pow(1 + inf, i) : 0;
        const withdrawal = Math.min(desired, available);
        nw = available - withdrawal;
        rows.push({ age: a, withdrawal, netWorth: nw, retired: a >= retireAge, shortfall: withdrawal < desired });
      }
      return rows;
    }

    const SVG_NS = "http://www.w3.org/2000/svg";
    const chartArea = document.getElementById("chartArea");
    const svg = document.getElementById("chart");
    const tooltip = document.getElementById("tooltip");
    const compact = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", notation: "compact", maximumFractionDigits: 1 });
    let lastRows = null, lastRetireAge = null;

    function el(name, attrs, parent) {
      const node = document.createElementNS(SVG_NS, name);
      for (const k in attrs) node.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(node);
      return node;
    }

    function niceStep(max, count) {
      const raw = max / count;
      const mag = Math.pow(10, Math.floor(Math.log10(raw)));
      const n = raw / mag;
      return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
    }

    function drawChart(rows, retireAge) {
      lastRows = rows; lastRetireAge = retireAge;
      svg.replaceChildren();
      tooltip.style.display = "none";
      const W = Math.max(300, svg.parentElement.clientWidth);
      const H = Math.round(Math.min(360, Math.max(220, W * 0.5)));
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
      const m = { top: 12, right: 16, bottom: 32, left: 64 };
      const iw = W - m.left - m.right, ih = H - m.top - m.bottom;

      const minAge = rows[0].age, maxAge = rows[rows.length - 1].age;
      const peak = Math.max(1, ...rows.map(r => Math.max(r.netWorth, r.withdrawal)));
      const yStep = niceStep(peak, 5);
      const yMax = Math.ceil(peak / yStep) * yStep;
      const x = a => m.left + (maxAge === minAge ? iw / 2 : (a - minAge) / (maxAge - minAge) * iw);
      const y = v => m.top + ih - (v / yMax) * ih;

      // Y grid + labels
      for (let v = 0; v <= yMax + yStep / 2; v += yStep) {
        el("line", { x1: m.left, x2: m.left + iw, y1: y(v), y2: y(v), class: v === 0 ? "axis" : "grid" }, svg);
        const t = el("text", { x: m.left - 8, y: y(v) + 4, "text-anchor": "end" }, svg);
        t.textContent = compact.format(v);
      }
      // X ticks + labels
      const span = maxAge - minAge;
      const xStep = span <= 12 ? 1 : span <= 30 ? 5 : 10;
      for (let a = Math.ceil(minAge / xStep) * xStep; a <= maxAge; a += xStep) {
        const t = el("text", { x: x(a), y: m.top + ih + 20, "text-anchor": "middle" }, svg);
        t.textContent = a;
      }
      // Retirement marker
      if (retireAge > minAge && retireAge <= maxAge) {
        el("line", { x1: x(retireAge), x2: x(retireAge), y1: m.top, y2: m.top + ih, class: "retire-line" }, svg);
        const t = el("text", { x: x(retireAge) + 4, y: m.top + 12 }, svg);
        t.textContent = "Retire";
      }

      const path = key => rows.map((r, i) => `${i ? "L" : "M"}${x(r.age).toFixed(1)},${y(r[key]).toFixed(1)}`).join("");
      el("path", { d: path("withdrawal"), class: "line withdrawal" }, svg);
      el("path", { d: path("netWorth"), class: "line networth" }, svg);

      // Hover layer
      const cross = el("line", { y1: m.top, y2: m.top + ih, class: "crosshair", visibility: "hidden" }, svg);
      const dotW = el("circle", { r: 4, class: "dot", fill: "var(--withdrawal)", visibility: "hidden" }, svg);
      const dotN = el("circle", { r: 4, class: "dot", fill: "var(--networth)", visibility: "hidden" }, svg);
      const hit = el("rect", { x: m.left, y: 0, width: iw, height: H, fill: "transparent" }, svg);

      function show(clientX) {
        const box = svg.getBoundingClientRect();
        const px = (clientX - box.left) * (W / box.width);
        const age = Math.round(minAge + (px - m.left) / iw * (maxAge - minAge));
        const r = rows[Math.min(rows.length - 1, Math.max(0, age - minAge))];
        const cx = x(r.age);
        cross.setAttribute("x1", cx); cross.setAttribute("x2", cx);
        dotN.setAttribute("cx", cx); dotN.setAttribute("cy", y(r.netWorth));
        dotW.setAttribute("cx", cx); dotW.setAttribute("cy", y(r.withdrawal));
        [cross, dotN, dotW].forEach(n => n.setAttribute("visibility", "visible"));
        tooltip.innerHTML = `<strong>Age ${r.age}</strong><br>` +
          `<span class="sw" style="background:var(--networth)"></span>Net worth ${money.format(r.netWorth)}<br>` +
          `<span class="sw" style="background:var(--withdrawal)"></span>Withdrawal ${money.format(r.withdrawal)}`;
        tooltip.style.display = "block";
        const scale = box.width / W;
        const tx = cx * scale, tw = tooltip.offsetWidth;
        tooltip.style.left = (tx + 12 + tw > box.width ? tx - 12 - tw : tx + 12) + "px";
        tooltip.style.top = (m.top * scale) + "px";
      }
      function hide() {
        [cross, dotN, dotW].forEach(n => n.setAttribute("visibility", "hidden"));
        tooltip.style.display = "none";
      }
      hit.addEventListener("pointermove", e => show(e.clientX));
      hit.addEventListener("pointerdown", e => show(e.clientX));
      hit.addEventListener("pointerleave", hide);
    }

    window.addEventListener("resize", () => { if (lastRows && !chartArea.hidden) drawChart(lastRows, lastRetireAge); });

    function render() {
      rowsEl.innerHTML = "";
      errorEl.textContent = "";
      chartArea.hidden = true;
      const v = readInputs();
      if (!v) {
        summaryEl.textContent = "Fill in all fields to see your projection.";
        return;
      }
      if (!Number.isInteger(v.age) || !Number.isInteger(v.retireAge) || v.age < 0 || v.age > END_AGE) {
        errorEl.textContent = `Ages must be whole numbers, with current age between 0 and ${END_AGE}.`;
        summaryEl.textContent = "";
        return;
      }

      const rows = project(v);
      const frag = document.createDocumentFragment();
      for (const r of rows) {
        const tr = document.createElement("tr");
        if (r.retired) tr.className = "retired";
        const cells = [String(r.age), money.format(r.withdrawal), money.format(r.netWorth)];
        cells.forEach((text, idx) => {
          const td = document.createElement("td");
          td.textContent = text;
          tr.appendChild(td);
        });
        frag.appendChild(tr);
      }
      rowsEl.appendChild(frag);
      chartArea.hidden = false;
      drawChart(rows, v.retireAge);

      const broke = rows.find(r => r.shortfall);
      summaryEl.textContent = broke
        ? `Net worth runs out at age ${broke.age}; withdrawals are $0 after that.`
        : `Net worth lasts through age ${END_AGE}, ending at ${money.format(rows[rows.length - 1].netWorth)}.`;
    }

    form.addEventListener("input", render);
  </script>
</body>
</html>
