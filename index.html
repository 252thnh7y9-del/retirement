<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retirement Planner</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1d2330;
      --muted: #5d6677;
      --border: #dde1e8;
      --accent: #2f6fdf;
      --negative: #c62828;
      --retired-row: #eef4ff;
      --networth: #111111;
      --growth: #1a8f4c;
      --withdrawal: #d03b3b;
      --grid: #e6e9ee;
      --page-good: #dcefe1;
      --page-bad: #f6dada;
      --band-light: rgba(220, 70, 70, 0.16);
      --band-dark: rgba(150, 20, 20, 0.38);
      --band-good-light: rgba(40, 160, 80, 0.18);
      --band-good-dark: rgba(20, 110, 50, 0.40);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171c;
        --card: #1d2128;
        --text: #e6e9ef;
        --muted: #9aa3b2;
        --border: #313744;
        --accent: #6a9cf5;
        --negative: #ff6b6b;
        --retired-row: #1f2a3d;
        --networth: #f2f2f2;
        --growth: #34b56f;
        --withdrawal: #f26060;
        --grid: #2a2f38;
        --page-good: #13281b;
        --page-bad: #2e1616;
        --band-light: rgba(255, 110, 110, 0.16);
        --band-dark: rgba(200, 40, 40, 0.42);
        --band-good-light: rgba(70, 200, 110, 0.16);
        --band-good-dark: rgba(40, 170, 80, 0.42);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      transition: background-color 0.3s;
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.4;
    }
    /* Page color reflects the outcome at age 100: green = money left, red = ran out. */
    body[data-outcome="good"] { background: var(--page-good); }
    body[data-outcome="bad"] { background: var(--page-bad); }
    main { max-width: 1600px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    .subtitle { margin: 0 0 20px; color: var(--muted); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }
    form { display: flex; flex-wrap: wrap; gap: 12px 32px; }
    .group { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; font-weight: 600; white-space: nowrap; }
    .hint { font-weight: 400; color: var(--muted); }
    input.short { width: 4.5em; }
    input.money { width: 9.5em; }
    input {
      font: inherit;
      font-weight: 400;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .error { color: var(--negative); margin: 10px 0 0; }
    .error:empty { display: none; }
    .share { margin: 12px 0 0; font-size: 0.9rem; }
    .share a { color: var(--accent); font-weight: 600; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { padding: 8px 12px; border-bottom: 1px solid var(--border); text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    th { position: sticky; top: 0; background: var(--card); font-size: 0.85rem; color: var(--muted); }
    tr.retired td { background: var(--retired-row); }
    .chart-wrap { position: relative; }
    .chart { display: block; width: 100%; height: auto; }
    .chart text { fill: var(--muted); font-size: 12px; font-family: inherit; }
    .chart .grid { stroke: var(--grid); stroke-width: 1; }
    .chart .axis { stroke: var(--border); stroke-width: 1; }
    .chart .retire-line { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 4; }
    .chart .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .chart .dot { stroke: var(--card); stroke-width: 2; }
    .chart .crosshair { stroke: var(--muted); stroke-width: 1; }
    .chart-title { margin: 0 0 4px; font-size: 1rem; }
    .chart-note { margin: 0 0 10px; color: var(--muted); font-size: 0.85rem; }
    .legend { display: flex; gap: 20px; margin: 0 0 8px; font-size: 0.9rem; color: var(--text); flex-wrap: wrap; }
    .legend span { display: inline-flex; align-items: center; gap: 8px; }
    .legend svg { width: 28px; height: 4px; overflow: visible; }
    .tooltip {
      position: absolute; pointer-events: none; display: none;
      background: var(--card); border: 1px solid var(--border); border-radius: 6px;
      padding: 6px 10px; font-size: 0.85rem; white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12); font-variant-numeric: tabular-nums;
    }
    .tooltip .sw { display: inline-block; width: 10px; height: 2px; margin-right: 6px; vertical-align: middle; }
    .table-wrap { max-height: 70vh; overflow: auto; }
    /* Wide screens: summary beside the inputs; charts stacked on the left, table filling the column on the right. */
    @media (min-width: 1100px) {
      .top { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 20px; align-items: stretch; }
      .top .summary { display: flex; flex-direction: column; justify-content: center; }
      .results {
        display: grid;
        grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
        grid-template-areas: "chart table" "scen table";
        column-gap: 20px;
        align-items: start;
      }
      #chartCard { grid-area: chart; }
      #scenarioCard { grid-area: scen; }
      #tableCard { grid-area: table; align-self: stretch; position: relative; margin-bottom: 20px; }
      #tableCard .table-wrap { position: absolute; inset: 20px; max-height: none; }
    }
    @media (max-width: 520px) {
      .card { padding: 14px 10px; }
      th, td { padding: 6px 4px; font-size: 0.78rem; }
    }
    .summary { margin: 0 0 20px; font-weight: 600; }
    .summary:empty { display: none; }
    td.negative { color: var(--negative); }
  </style>
</head>
<body>
  <main>
    <h1>Retirement Planner</h1>
    <p class="subtitle">Nothing is saved</p>

    <div class="top">
    <section class="card">
      <form id="inputs" autocomplete="off" onsubmit="return false">
        <div class="group">
          <label>Current age
            <input type="number" id="age" class="short" min="0" max="120" step="1">
          </label>
          <label>Retirement age
            <input type="number" id="retireAge" class="short" min="0" max="120" step="1" value="55">
          </label>
        </div>
        <div class="group">
          <label>Inflation %
            <input type="number" id="inflation" class="short" step="0.1" value="4">
          </label>
          <label>Growth %
            <input type="number" id="growth" class="short" step="0.1" value="6">
          </label>
        </div>
        <div class="group">
          <label><span>Retirement income $/yr <span class="hint">(today's $)</span></span>
            <input type="number" id="income" class="money" min="0" step="1000" placeholder="e.g. 80000">
          </label>
          <label>Current net worth $
            <input type="number" id="netWorth" class="money" step="1000" placeholder="e.g. 500000">
          </label>
        </div>
      </form>
      <p class="error" id="error"></p>
      <p class="share">
        <a id="shareLink" href="">Link to these inputs</a>
      </p>
    </section>

    <div class="card summary" id="summary">Fill in all fields to see your projection.</div>
    </div>

    <div class="results">
    <section class="card" id="chartCard" hidden>
      <div>
        <h2 class="chart-title">Annual Changes to Net Worth</h2>
        <div class="legend">
          <span><svg viewBox="0 0 28 4"><line x1="0" y1="2" x2="28" y2="2" stroke="var(--withdrawal)" stroke-width="2" stroke-dasharray="6 4"/></svg>Withdrawal</span>
          <span><svg viewBox="0 0 28 4"><line x1="0" y1="2" x2="28" y2="2" stroke="var(--growth)" stroke-width="2"/></svg>Growth</span>
        </div>
        <div class="chart-wrap">
          <svg class="chart" id="chart" role="img" aria-label="Withdrawal and growth by age"></svg>
          <div class="tooltip" id="tooltip"></div>
        </div>
      </div>
    </section>

    <section class="card" id="tableCard" hidden>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Age</th><th>Withdrawal</th><th>Growth</th><th>Net Worth</th><th>%</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>

    <section class="card" id="scenarioCard" hidden>
      <h2 class="chart-title">Net Worth Scenarios</h2>
      <p class="chart-note">Varying inflation and growth by 1-2%</p>
      <div class="chart-wrap">
        <svg class="chart" id="scenarioChart" role="img" aria-label="Net worth by age with growth 1 to 2 points lower and inflation 1 to 2 points higher"></svg>
        <div class="tooltip" id="scenarioTooltip"></div>
      </div>
    </section>
    </div>
  </main>

  <script>
    const END_AGE = 100;
    const ids = ["age", "retireAge", "income", "inflation", "netWorth", "growth"];
    const form = document.getElementById("inputs");
    const rowsEl = document.getElementById("rows");
    const summaryEl = document.getElementById("summary");
    const errorEl = document.getElementById("error");
    const money = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });

    const shareLink = document.getElementById("shareLink");

    // Some browsers restore form values on reload / back navigation; force a clean slate,
    // then fill in any values given as URL params (e.g. ?age=45&income=80000).
    // Param names match the input ids: age, retireAge, income, inflation, netWorth, growth.
    window.addEventListener("pageshow", () => {
      form.reset();
      const params = new URLSearchParams(location.search);
      for (const id of ids) {
        const val = params.get(id);
        if (val !== null && val.trim() !== "" && Number.isFinite(Number(val))) {
          document.getElementById(id).value = Number(val);
        }
      }
      render();
    });

    // Keeps the share link pointing at the current inputs. The address bar is left alone
    // so a plain refresh still resets the page.
    function updateShareLink() {
      const params = new URLSearchParams();
      for (const id of ids) {
        const val = document.getElementById(id).value.trim();
        if (val !== "") params.set(id, val);
      }
      const url = new URL(location.href);
      url.search = params.toString();
      url.hash = "";
      shareLink.href = url.toString();
    }


    function readInputs() {
      const v = {};
      for (const id of ids) {
        const raw = document.getElementById(id).value.trim();
        if (raw === "") return null;
        v[id] = Number(raw);
      }
      return v;
    }

    // Each row is one year. Before retirement there is no withdrawal.
    // From retirement on, withdrawal = desired income inflated from today to that age.
    // Growth = previous year's net worth × growth rate.
    // Net worth = previous year's net worth + growth − withdrawal.
    // Net worth never goes below zero: the withdrawal is capped at whatever is left,
    // so the year the money runs out takes the remainder and later years withdraw nothing.
    function project({ age, retireAge, income, inflation, netWorth, growth }) {
      const rows = [];
      const inf = inflation / 100;
      const g = growth / 100;
      let nw = Math.max(0, netWorth);
      for (let a = age, i = 0; a <= END_AGE; a++, i++) {
        const prev = nw;
        const growthAmt = i === 0 ? 0 : nw * g;
        const available = nw + growthAmt;
        const desired = a >= retireAge ? income * Math.pow(1 + inf, i) : 0;
        const withdrawal = Math.min(desired, available);
        nw = available - withdrawal;
        const pctChange = i === 0 || prev === 0 ? null : (nw - prev) / prev * 100;
        rows.push({ age: a, available, withdrawal, growth: growthAmt, netWorth: nw, pctChange, retired: a >= retireAge, shortfall: withdrawal < desired });
      }
      return rows;
    }

    // Year-over-year change in net worth; blank for the first year or when last year was $0.
    function pctText(p) {
      if (p === null) return "—";
      const r = Math.round(p * 10) / 10;
      return (r > 0 ? "+" : "") + (r === 0 ? "0.0" : r.toFixed(1)) + "%";
    }

    const SVG_NS = "http://www.w3.org/2000/svg";
    const chartArea = document.getElementById("chartCard");
    const svg = document.getElementById("chart");
    const tooltip = document.getElementById("tooltip");
    const compact = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", notation: "compact", maximumFractionDigits: 1 });
    const scenCard = document.getElementById("scenarioCard");
    const tableCard = document.getElementById("tableCard");
    const scenSvg = document.getElementById("scenarioChart");
    const scenTooltip = document.getElementById("scenarioTooltip");
    let lastInputs = null;

    function el(name, attrs, parent) {
      const node = document.createElementNS(SVG_NS, name);
      for (const k in attrs) node.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(node);
      return node;
    }

    function niceStep(max, count) {
      const raw = max / count;
      const mag = Math.pow(10, Math.floor(Math.log10(raw)));
      const n = raw / mag;
      return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
    }

    // Draws a line chart into `svg`. `series` is a list of { label, color, dash, values },
    // one value per age; later series are drawn on top. Tooltip lists them in `tipOrder`.
    // `bands` optionally shades between two value lists: { upper, lower, color }.
    // `headroom`, if set, scales the Y axis to the drawn lines' peak × headroom instead of
    // fitting the bands; anything taller is clipped at the top of the plot.
    function drawChart(svg, tooltip, ages, series, retireAge, tipOrder = series, bands = [], headroom = 0) {
      svg.replaceChildren();
      tooltip.style.display = "none";
      const W = Math.max(300, svg.parentElement.clientWidth);
      const H = Math.round(Math.min(360, Math.max(220, W * 0.5)));
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
      const m = { top: 12, right: 16, bottom: 32, left: 64 };
      const iw = W - m.left - m.right, ih = H - m.top - m.bottom;

      const minAge = ages[0], maxAge = ages[ages.length - 1];
      const linePeak = Math.max(1, ...series.flatMap(sr => sr.values));
      const peak = headroom ? linePeak * headroom : Math.max(linePeak, ...bands.flatMap(b => b.upper));
      const yStep = niceStep(peak, 5);
      const yMax = Math.ceil(peak / yStep) * yStep;
      const x = a => m.left + (maxAge === minAge ? iw / 2 : (a - minAge) / (maxAge - minAge) * iw);
      const y = v => m.top + ih - (v / yMax) * ih;

      // Y grid + labels
      for (let v = 0; v <= yMax + yStep / 2; v += yStep) {
        el("line", { x1: m.left, x2: m.left + iw, y1: y(v), y2: y(v), class: v === 0 ? "axis" : "grid" }, svg);
        const t = el("text", { x: m.left - 8, y: y(v) + 4, "text-anchor": "end" }, svg);
        t.textContent = compact.format(v);
      }
      // X ticks + labels
      const span = maxAge - minAge;
      const xStep = span <= 12 ? 1 : span <= 30 ? 5 : 10;
      for (let a = Math.ceil(minAge / xStep) * xStep; a <= maxAge; a += xStep) {
        const t = el("text", { x: x(a), y: m.top + ih + 20, "text-anchor": "middle" }, svg);
        t.textContent = a;
      }
      // Retirement marker
      if (retireAge > minAge && retireAge <= maxAge) {
        el("line", { x1: x(retireAge), x2: x(retireAge), y1: m.top, y2: m.top + ih, class: "retire-line" }, svg);
        const t = el("text", { x: x(retireAge) + 4, y: m.top + 12 }, svg);
        t.textContent = "Retire";
      }

      const clipId = `${svg.id}-plot`;
      const clip = el("clipPath", { id: clipId }, el("defs", {}, svg));
      el("rect", { x: m.left, y: m.top, width: iw, height: ih }, clip);
      for (const b of bands) {
        const top = b.upper.map((v, i) => `${i ? "L" : "M"}${x(ages[i]).toFixed(1)},${y(v).toFixed(1)}`).join("");
        const bottom = b.lower.map((v, i) => `L${x(ages[i]).toFixed(1)},${y(v).toFixed(1)}`).reverse().join("");
        el("path", { d: top + bottom + "Z", fill: b.color, stroke: "none", "clip-path": `url(#${clipId})` }, svg);
      }
      for (const sr of series) {
        const d = sr.values.map((v, i) => `${i ? "L" : "M"}${x(ages[i]).toFixed(1)},${y(v).toFixed(1)}`).join("");
        el("path", { d, class: "line", stroke: sr.color, "stroke-dasharray": sr.dash || "none" }, svg);
      }

      // Hover layer
      const cross = el("line", { y1: m.top, y2: m.top + ih, class: "crosshair", visibility: "hidden" }, svg);
      const dots = series.map(sr => el("circle", { r: 4, class: "dot", fill: sr.color, visibility: "hidden" }, svg));
      const hit = el("rect", { x: m.left, y: 0, width: iw, height: H, fill: "transparent" }, svg);

      function show(clientX) {
        const box = svg.getBoundingClientRect();
        const px = (clientX - box.left) * (W / box.width);
        const i = Math.min(ages.length - 1, Math.max(0, Math.round((px - m.left) / iw * (maxAge - minAge))));
        const cx = x(ages[i]);
        cross.setAttribute("x1", cx); cross.setAttribute("x2", cx);
        series.forEach((sr, k) => { dots[k].setAttribute("cx", cx); dots[k].setAttribute("cy", y(sr.values[i])); });
        [cross, ...dots].forEach(n => n.setAttribute("visibility", "visible"));
        tooltip.innerHTML = `<strong>Age ${ages[i]}</strong>` + tipOrder.map(sr =>
          `<br><span class="sw" style="${sr.box ? `background:${sr.color};height:10px;width:10px` : sr.dash ? `border-top:2px dashed ${sr.color};height:0` : `background:${sr.color}`}"></span>${sr.label} ${money.format(sr.values[i])}`).join("");
        tooltip.style.display = "block";
        const scale = box.width / W;
        const tx = cx * scale, tw = tooltip.offsetWidth;
        tooltip.style.left = (tx + 12 + tw > box.width ? tx - 12 - tw : tx + 12) + "px";
        tooltip.style.top = (m.top * scale) + "px";
      }
      function hide() {
        [cross, ...dots].forEach(n => n.setAttribute("visibility", "hidden"));
        tooltip.style.display = "none";
      }
      hit.addEventListener("pointermove", e => show(e.clientX));
      hit.addEventListener("pointerdown", e => show(e.clientX));
      hit.addEventListener("pointerleave", hide);
    }

    // Worst-case scenarios: growth lowered and inflation raised by these percentage points.
    // Shade tracks the growth cut (light = -1, dark = -2); dashes mark the bigger inflation bump.
    const SCENARIOS = [
      { growth: 2, inflation: -2, color: "var(--band-good-dark)" },
      { growth: 1, inflation: -1, color: "var(--band-good-light)" },
      { growth: -1, inflation: 1, color: "var(--band-light)" },
      { growth: -2, inflation: 2, color: "var(--band-dark)" },
    ];
    const signed = n => (n > 0 ? "+" : "") + n;
    const pts = n => +n.toFixed(2);

    function drawAll() {
      if (!lastInputs || chartArea.hidden) return;
      const { v, rows } = lastInputs;
      const ages = rows.map(r => r.age);
      const netWorth = { label: "Net worth", color: "var(--networth)", values: rows.map(r => r.netWorth) };
      const withdrawal = { label: "Withdrawal", color: "var(--withdrawal)", dash: "6 4", values: rows.map(r => r.withdrawal) };
      const growth = { label: "Growth", color: "var(--growth)", values: rows.map(r => r.growth) };
      drawChart(svg, tooltip, ages, [withdrawal, growth], v.retireAge);

      const scen = SCENARIOS.map(sc => {
        const g = v.growth + sc.growth, inf = v.inflation + sc.inflation;
        return {
          label: `${signed(sc.growth)}/${signed(sc.inflation)} (${pts(g)}% growth, ${pts(inf)}% infl.)`, color: sc.color, box: true,
          values: project({ ...v, growth: g, inflation: inf }).map(r => r.netWorth),
        };
      });
      const base = { ...netWorth, label: `Net Worth (${pts(v.growth)}% growth, ${pts(v.inflation)}% infl.)` };
      // Only the net worth line is drawn; the scenarios appear as shaded bands (and in the
      // tooltip): green above it for better growth/inflation, red below it for worse.
      const [best, good, bad, worst] = scen;
      const bands = [
        { upper: best.values, lower: good.values, color: best.color },
        { upper: good.values, lower: base.values, color: good.color },
        { upper: base.values, lower: bad.values, color: bad.color },
        { upper: bad.values, lower: worst.values, color: worst.color },
      ];
      // Scale to the net worth line (+50% headroom) so the upside bands don't flatten the rest.
      drawChart(scenSvg, scenTooltip, ages, [base], v.retireAge, [best, good, base, bad, worst], bands, 1.5);
    }

    window.addEventListener("resize", drawAll);

    function render() {
      delete document.body.dataset.outcome;
      updateShareLink();
      rowsEl.innerHTML = "";
      errorEl.textContent = "";
      chartArea.hidden = true;
      scenCard.hidden = true;
      tableCard.hidden = true;
      lastInputs = null;
      const v = readInputs();
      if (!v) {
        summaryEl.textContent = "Fill in all fields to see your projection.";
        return;
      }
      if (!Number.isInteger(v.age) || !Number.isInteger(v.retireAge) || v.age < 0 || v.age > END_AGE) {
        errorEl.textContent = `Ages must be whole numbers, with current age between 0 and ${END_AGE}.`;
        summaryEl.textContent = "";
        return;
      }

      const rows = project(v);
      const frag = document.createDocumentFragment();
      for (const r of rows) {
        const tr = document.createElement("tr");
        if (r.retired) tr.className = "retired";
        const cells = [String(r.age), money.format(r.withdrawal), money.format(r.growth), money.format(r.netWorth), pctText(r.pctChange)];
        cells.forEach((text, idx) => {
          const td = document.createElement("td");
          td.textContent = text;
          if (idx === 4 && r.pctChange <= -0.05) td.className = "negative";
          tr.appendChild(td);
        });
        frag.appendChild(tr);
      }
      rowsEl.appendChild(frag);
      chartArea.hidden = false;
      scenCard.hidden = false;
      tableCard.hidden = false;
      lastInputs = { v, rows };
      drawAll();

      const broke = rows.find(r => r.shortfall);
      document.body.dataset.outcome = rows[rows.length - 1].netWorth > 0 ? "good" : "bad";
      const lines = [broke
        ? `Net worth runs out at age ${broke.age}; withdrawals are $0 after that.`
        : `Net worth lasts through age ${END_AGE}, ending at ${money.format(rows[rows.length - 1].netWorth)}.`];
      // Withdrawal rate in the first retirement year, measured against the net worth
      // available that year (after growth, before the withdrawal comes out).
      const firstRetired = rows.find(r => r.retired);
      if (firstRetired && firstRetired.available > 0) {
        const rate = firstRetired.withdrawal / firstRetired.available * 100;
        lines.push(`At retirement, withdrawal is ${rate.toFixed(1)}% of net worth.`);
      }
      summaryEl.replaceChildren(...lines.map(text => {
        const div = document.createElement("div");
        div.textContent = text;
        return div;
      }));
    }

    form.addEventListener("input", render);
  </script>
</body>
</html>
